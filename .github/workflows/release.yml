name: Release

# Pushing a tag like v0.2.0 builds installers + portable zips for Windows, macOS and
# Linux and creates a *draft* GitHub release with them (publish it by hand after a check).
# "Run workflow" (workflow_dispatch) builds the same files as artifacts only, for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match Cargo.toml version $v"; exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace --locked
      - name: Stage files
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/release/macropad-remapper-gui.exe target/release/macropad-remapper.exe stage/
          cp README.md CHANGELOG.md docs/user-guide.md LICENSE-MIT LICENSE-APACHE examples/example-profile.yaml stage/
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:V" "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\dist" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          $n = "macropad-remapper-$env:V-windows-x64-portable"
          New-Item -ItemType Directory $n | Out-Null
          Copy-Item stage\* $n
          Compress-Archive -Path $n -DestinationPath "dist\$n.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --workspace --locked --target aarch64-apple-darwin
          cargo build --release --workspace --locked --target x86_64-apple-darwin
      - name: App bundle
        run: |
          APP="Macropad Remapper.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for b in macropad-remapper-gui macropad-remapper; do
            lipo -create -output "$APP/Contents/MacOS/$b" \
              target/aarch64-apple-darwin/release/$b target/x86_64-apple-darwin/release/$b
          done
          sed "s/@VERSION@/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icons/icon-1024.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d packaging/icons/icon-1024.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"   # ad-hoc signature (required on Apple Silicon)
          codesign --verify --deep "$APP"
      - name: DMG installer + portable zip
        run: |
          APP="Macropad Remapper.app"
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          cp README.md docs/user-guide.md dmg/
          hdiutil create -volname "Macropad Remapper $V" -srcfolder dmg -ov -format UDZO \
            "dist/macropad-remapper-$V-macos-universal.dmg"
          P="macropad-remapper-$V-macos-universal-portable"
          mkdir "$P"
          cp -R "$APP" "$P/"
          cp README.md CHANGELOG.md docs/user-guide.md LICENSE-MIT LICENSE-APACHE examples/example-profile.yaml "$P/"
          ditto -c -k --keepParent "$P" "dist/$P.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  linux:
    needs: version
    # Oldest supported runner = widest glibc compatibility for the portable build.
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev libgtk-3-dev libxkbcommon-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: cargo build --release --workspace --locked
      - name: .deb and .rpm
        run: |
          mkdir -p dist
          cargo deb -p macropad-remapper-gui --no-build --no-strip \
            -o "dist/macropad-remapper-$V-linux-amd64.deb"
          cargo generate-rpm -p crates/gui -o "dist/macropad-remapper-$V-linux-x86_64.rpm"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: Portable zip
        run: |
          P="macropad-remapper-$V-linux-x86_64-portable"
          mkdir "$P"
          cp target/release/macropad-remapper-gui target/release/macropad-remapper "$P/"
          cp packaging/99-macropad-remapper.rules packaging/linux/macropad-remapper.desktop "$P/"
          cp packaging/icons/icon-256.png "$P/macropad-remapper.png"
          cp README.md CHANGELOG.md docs/user-guide.md LICENSE-MIT LICENSE-APACHE examples/example-profile.yaml "$P/"
          zip -r -y "dist/$P.zip" "$P"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  release:
    needs: [version, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "Macropad Remapper $V" --notes-file "$NOTES"
          fi
