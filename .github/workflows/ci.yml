name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev libgtk-3-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp target/release/macropad-remapper$ext target/release/macropad-remapper-gui$ext dist/
          cp README.md CHANGELOG.md docs/user-guide.md docs/protocol.md examples/example-profile.yaml packaging/99-macropad-remapper.rules dist/
      - uses: actions/upload-artifact@v7
        with:
          name: macropad-remapper-${{ matrix.target }}
          path: dist/
